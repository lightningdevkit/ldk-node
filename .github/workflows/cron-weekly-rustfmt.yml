name: Nightly rustfmt

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * 0" # runs weekly on Sunday at 00:00
  workflow_dispatch: # allows manual triggering
jobs:
  format:
    name: Nightly rustfmt
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Nightly 2026-09-23 and later reformat code that stable rustfmt reverts
      # (see #1118). Keep the last nightly compatible with stable CI checks.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-22
          components: rustfmt
      - name: Run Nightly rustfmt
        # Run the formatter and manually remove trailing whitespace.
        run: cargo +nightly-2026-09-22 fmt && git ls-files -- '*.rs' -z | xargs sed -E -i'' -e 's/[[:space:]]+$//'
      - name: Get the current date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          author: Fmt Bot <bot@example.com>
          title: Automated nightly rustfmt (${{ env.date }})
          body: |
           Automated nightly `rustfmt` changes by [create-pull-request](https://github.com/peter-evans/create-pull-request) GitHub action
          commit-message: ${{ env.date }} automated rustfmt nightly 
          labels: rustfmt
